# Bootstrap-only HTTP virtual host for the first ACME webroot challenge.
# Replace this file with ego.example.invalid.conf after the certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name ego.example.invalid;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
