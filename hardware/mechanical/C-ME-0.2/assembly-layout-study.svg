<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1370" viewBox="0 0 1800 1370">
<title>Ego Link 现板装配关系研究</title>
<desc>不按比例的 A/B 装配关系示意，不表示实际器件位置、尺寸或装配通过。</desc>
<rect width="1800" height="1370" fill="#F4F2ED"/>
<text x="55" y="40" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="43" fill="#253A40" dominant-baseline="text-before-edge">EGO LINK · 现板装配布局研究</text>
<text x="58" y="105" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#64767A" dominant-baseline="text-before-edge">C-ME-0.2  /  2026-10-10     关系示意，不按比例；不代表实际元件位置或已通过装配。</text>
<rect x="50" y="170" width="825" height="690" rx="12" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<text x="78" y="197" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="34" fill="#253A40" dominant-baseline="text-before-edge">A  主板与电池背叠</text>
<text x="78" y="252" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#64767A" dominant-baseline="text-before-edge">首台样机优先评审：少改现板，接受厚度代价</text>
<text x="85" y="306" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#64767A" dominant-baseline="text-before-edge">外侧 / 前功能壳（镜头、声学件另行分区）</text>
<rect x="85" y="349" width="750" height="18" rx="5" fill="#9AA7A5" stroke="none" stroke-width="2"/>
<rect x="105" y="393" width="174" height="124" rx="12" fill="#C9DDEE" stroke="#7893AB" stroke-width="2"/>
<text x="126" y="414" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#253A40" dominant-baseline="text-before-edge">GNSS 分仓</text>
<text x="126" y="451" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#253A40" dominant-baseline="text-before-edge">整体高度待测</text>
<line x1="297" y1="381" x2="297" y2="609" stroke="#C0C7C6" stroke-width="2"/>
<rect x="320" y="417" width="495" height="16" rx="2" fill="#3B8C74" stroke="none" stroke-width="2"/>
<rect x="345" y="385" width="100" height="32" rx="3" fill="#C3DED1" stroke="#7BA994" stroke-width="2"/>
<rect x="612" y="393" width="125" height="24" rx="3" fill="#C3DED1" stroke="#7BA994" stroke-width="2"/>
<rect x="335" y="433" width="190" height="70" rx="4" fill="#C9CECD" stroke="#82918E" stroke-width="2"/>
<text x="352" y="452" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#253A40" dominant-baseline="text-before-edge">高器件区域</text>
<rect x="580" y="433" width="175" height="25" rx="3" fill="#C3DED1" stroke="#7BA994" stroke-width="2"/>
<line x1="320" y1="527" x2="615" y2="527" stroke="#BE9850" stroke-width="4"/>
<rect x="320" y="548" width="295" height="65" rx="8" fill="#F3D79A" stroke="#BE9850" stroke-width="2"/>
<text x="338" y="566" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#253A40" dominant-baseline="text-before-edge">电池 Pack ＋托盘</text>
<rect x="85" y="640" width="750" height="18" rx="5" fill="#9AA7A5" stroke="none" stroke-width="2"/>
<text x="80" y="702" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#253A40" dominant-baseline="text-before-edge">电池跨过高器件投影，离板间距由其制约。</text>
<text x="80" y="745" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#253A40" dominant-baseline="text-before-edge">分仓使 GNSS 不再叠加到电池厚度上。</text>
<text x="80" y="788" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#253A40" dominant-baseline="text-before-edge">实装壳外形允许大于既有概念参考尺寸。</text>
<rect x="925" y="170" width="825" height="690" rx="12" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<text x="953" y="197" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="34" fill="#253A40" dominant-baseline="text-before-edge">B  电池局部错位</text>
<text x="953" y="252" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#64767A" dominant-baseline="text-before-edge">减薄候选：增加平面面积，先验证低器件区</text>
<text x="960" y="306" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#64767A" dominant-baseline="text-before-edge">外侧 / 前功能壳（镜头、声学件另行分区）</text>
<rect x="960" y="349" width="750" height="18" rx="5" fill="#9AA7A5" stroke="none" stroke-width="2"/>
<rect x="980" y="393" width="174" height="124" rx="12" fill="#C9DDEE" stroke="#7893AB" stroke-width="2"/>
<text x="1001" y="414" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#253A40" dominant-baseline="text-before-edge">GNSS 分仓</text>
<text x="1001" y="451" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#253A40" dominant-baseline="text-before-edge">整体高度待测</text>
<line x1="1172" y1="381" x2="1172" y2="609" stroke="#C0C7C6" stroke-width="2"/>
<rect x="1195" y="417" width="495" height="16" rx="2" fill="#3B8C74" stroke="none" stroke-width="2"/>
<rect x="1220" y="385" width="100" height="32" rx="3" fill="#C3DED1" stroke="#7BA994" stroke-width="2"/>
<rect x="1487" y="393" width="125" height="24" rx="3" fill="#C3DED1" stroke="#7BA994" stroke-width="2"/>
<rect x="1210" y="433" width="190" height="70" rx="4" fill="#C9CECD" stroke="#82918E" stroke-width="2"/>
<text x="1227" y="452" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#253A40" dominant-baseline="text-before-edge">高器件区域</text>
<rect x="1455" y="433" width="175" height="25" rx="3" fill="#C3DED1" stroke="#7BA994" stroke-width="2"/>
<line x1="1430" y1="485" x2="1725" y2="485" stroke="#BE9850" stroke-width="4"/>
<rect x="1430" y="506" width="295" height="65" rx="8" fill="#F3D79A" stroke="#BE9850" stroke-width="2"/>
<text x="1465" y="525" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#253A40" dominant-baseline="text-before-edge">错位电池 Pack</text>
<rect x="960" y="602" width="765" height="18" rx="5" fill="#9AA7A5" stroke="none" stroke-width="2"/>
<text x="970" y="649" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#64767A" dominant-baseline="text-before-edge">示意：电池向板外延伸，壳体平面尺寸增加</text>
<text x="955" y="702" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#253A40" dominant-baseline="text-before-edge">仅在真实低器件区、线束与电池尺寸允许时成立。</text>
<text x="955" y="745" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#253A40" dominant-baseline="text-before-edge">板外延伸也可能沿长度方向，图中方向未冻结。</text>
<text x="955" y="788" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#253A40" dominant-baseline="text-before-edge">没有高度地图与碰撞检查，不能承诺减薄。</text>
<text x="58" y="889" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="32" fill="#253A40" dominant-baseline="text-before-edge">共同装配原则</text>
<rect x="50" y="948" width="520" height="208" rx="12" fill="#E6EBE7" stroke="none" stroke-width="2"/>
<text x="72" y="972" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" fill="#253A40" dominant-baseline="text-before-edge">01  定位与承力</text>
<text x="72" y="1022" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#253A40" dominant-baseline="text-before-edge">内托架支承 PCB；电池独立固定。</text>
<text x="72" y="1058" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#253A40" dominant-baseline="text-before-edge">板边压片需避开器件与走线。</text>
<text x="72" y="1094" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#253A40" dominant-baseline="text-before-edge">不把排孔、插座或软排线当固定件。</text>
<rect x="640" y="948" width="520" height="208" rx="12" fill="#E6EBE7" stroke="none" stroke-width="2"/>
<text x="662" y="972" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" fill="#253A40" dominant-baseline="text-before-edge">02  连接与维修</text>
<text x="662" y="1022" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#253A40" dominant-baseline="text-before-edge">接插件配合高度、FPC 转弯都计入。</text>
<text x="662" y="1058" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#253A40" dominant-baseline="text-before-edge">先接被遮挡的线，再装电池托盘。</text>
<text x="662" y="1094" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#253A40" dominant-baseline="text-before-edge">GNSS、天线、镜头各有固定与应力释放。</text>
<rect x="1230" y="948" width="520" height="208" rx="12" fill="#E6EBE7" stroke="none" stroke-width="2"/>
<text x="1252" y="972" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" fill="#253A40" dominant-baseline="text-before-edge">03  壳体与密封</text>
<text x="1252" y="1022" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#253A40" dominant-baseline="text-before-edge">后盖密封、声腔、窗口分别设计。</text>
<text x="1252" y="1058" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#253A40" dominant-baseline="text-before-edge">USB 沿用现板位置；湿区方案待评审。</text>
<text x="1252" y="1094" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#253A40" dominant-baseline="text-before-edge">腕带／背夹载荷传给承力壳与载体。</text>
<rect x="50" y="1190" width="1700" height="122" rx="12" fill="#E8DCC9" stroke="none" stroke-width="2"/>
<text x="78" y="1210" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" fill="#253A40" dominant-baseline="text-before-edge">尺寸输入仍缺：去工艺边 PCB 外形与双面高度 / GNSS 整体包络 / 电池 Pack 最大包络。</text>
<text x="78" y="1258" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#253A40" dominant-baseline="text-before-edge">下一步：实测 → A/B 三维占位与干涉检查 → 干态装配样壳 → 带壳专项验证。</text>
<text x="58" y="1331" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#64767A" dominant-baseline="text-before-edge">两版外观均保留；60×44×22 mm 外壳、48×34 mm 主板均非现板实测或已确认装配尺寸。</text>
</svg>
